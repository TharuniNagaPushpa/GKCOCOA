<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Cocoa Beans | GKCocoa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #3b2115;
        }

        nav {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3b2115;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #d9a15b;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .product-page {
            max-width: 1100px;
            margin: 70px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .product-page img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 15px;
        }

        .details h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .details p {
            font-size: 17px;
            line-height: 1.7;
            color: #70594d;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #9a5e28;
            margin-bottom: 25px;
        }

        .buy-btn {
            display: inline-block;
            padding: 14px 30px;
            background: #3b2115;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .buy-btn:hover {
            background: #9a5e28;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #70594d;
            text-decoration: none;
        }

        @media (max-width: 800px) {
            .product-page {
                grid-template-columns: 1fr;
            }

            .product-page img {
                height: 350px;
            }
        }
    </style>
</head>
<script src="/cart.js"></script>
<body>

<nav>
    <div class="logo">GK<span>Cocoa</span></div>

    <a href="index.html">Home</a>
</nav>

<section class="product-page">

    <img src="/images/premium-cocoa.jpg"
         alt="Premium cocoa beans">

    <div class="details">

        <h1>Premium Cocoa Beans</h1>

        <p>
            Carefully selected high-quality cocoa beans,
            sourced for rich flavour and excellent quality.
        </p>

        <div class="price">₹299 / kg</div>

        <a href="cart.html" class="buy-btn" onclick="addToCart('Premium Cocoa Beans', 299);
           return false;">Add to Cart</a>

        <br>

        <a href="index.html" class="back">
            ← Back to Products
        </a>

    </div>

</section>

</body>
</html>
