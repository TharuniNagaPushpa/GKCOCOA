<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Order | GKCocoa</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #3b2115;
        }

        nav {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3b2115;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #d9a15b;
        }

        .container {
            max-width: 600px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(60, 30, 10, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6c4b8;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #3b2115;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a3322;
        }

        #result {
            margin-top: 30px;
        }

        .order-box {
            padding: 20px;
            border-radius: 10px;
            background: #fff4e8;
        }

        .order-box p {
            margin: 12px 0;
            font-size: 16px;
        }

        .status {
            font-weight: bold;
            color: #8b5a2b;
        }

        .error {
            color: #b00020;
            text-align: center;
        }

    </style>

</head>

<body>

<nav>

    <div class="logo">
        GK<span>Cocoa</span>
    </div>

</nav>


<div class="container">

    <h1>Track Your Order</h1>

    <p class="subtitle">
        Enter your order ID to check your order status.
    </p>
    <label for="orderId">
        Order ID
    </label>

    <input type="text" id="orderId">

    <label for="phone">
        Phone Number
    </label>

    <input type="text" id="phone">

    <button onclick="trackOrder()">
        Track Order
    </button>


    <div id="result"></div>

</div>

<script>

    async function trackOrder() {

        const input = document.getElementById("orderId");
        const phoneInput = document.getElementById("phone");
        const result = document.getElementById("result");

        const value = input.value.trim();
        const phone = phoneInput.value.trim();

        if (!value || !phone) {
            result.innerHTML =
                '<p class="error">Please enter your Order ID and phone number.</p>';
            return;
        }

        let id = value.replace("GK", "");
        id = parseInt(id, 10);

        if (isNaN(id)) {
            result.innerHTML =
                '<p class="error">Invalid Order ID.</p>';
            return;
        }

        try {

            const response =
                await fetch(`/api/orders/${id}?phone=${encodeURIComponent(phone)}`);

            if (!response.ok) {
                result.innerHTML =
                    '<p class="error">Order not found or phone number does not match.</p>';
                return;
            }

            const order = await response.json();

            result.innerHTML = `

            <div class="order-box">

                <p>
                    <strong>Order ID:</strong>
                    GK${String(order.id).padStart(6, "0")}
                </p>

                <p>
                    <strong>Name:</strong>
                    ${order.fullName || ""}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status">
                        ${order.status || "Pending"}
                    </span>
                </p>

            </div>

        `;

        } catch (error) {

            console.error(error);

            result.innerHTML =
                '<p class="error">Something went wrong. Please try again.</p>';

        }

    }

</script>
</body>

</html>
