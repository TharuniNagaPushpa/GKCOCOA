<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | GKCocoa</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #3b2115;
        }

        nav {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3b2115;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #d9a15b;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .cart {
            max-width: 900px;
            margin: 60px auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(60, 30, 10, 0.1);

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .cart-item h3 {
            margin-bottom: 8px;
        }

        .cart-item p {
            color: #70594d;
        }

        button {
            border: none;
            padding: 8px 12px;
            margin: 3px;
            background: #3b2115;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #9a5e28;
        }

        .total {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .checkout {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #3b2115;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .checkout:hover {
            background: #9a5e28;
        }

    </style>
</head>

<body onload="loadCart()">

<nav>
    <div class="logo">GK<span>Cocoa</span></div>

    <a href="index.html">Home</a>
</nav>


<section class="cart">

    <h1>Your Cart</h1>

    <div id="cartItems"></div>

    <div class="total">
        Total: <span id="cartTotal">₹0</span>
    </div>

    <a href="checkout.html" class="checkout">
        Proceed to Checkout
    </a>

</section>


<script src="/cart.js"></script>

</body>

</html>
